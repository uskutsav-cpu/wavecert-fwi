name: Prior48 remote development

on:
  push:
    branches: [research-prior48-remote-01]
    paths: [research/prior48/RUN_REGISTRATION_01.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: prior48-remote-01
  cancel-in-progress: false

jobs:
  registered-development:
    if: github.repository == 'uskutsav-cpu/wavecert-fwi' && github.ref == 'refs/heads/research-prior48-remote-01'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MPLBACKEND: Agg
    steps:
      - name: Initialize bounded workflow evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prior48_artifacts/upload
          python -c 'import json,os; from pathlib import Path; Path("prior48_artifacts/upload/bootstrap.json").write_text(json.dumps({k:os.environ.get(k) for k in ("GITHUB_SHA","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","GITHUB_REF","GITHUB_REPOSITORY","RUNNER_OS")},indent=2)+"\n")'
      - name: Checkout registered experiment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: experiment
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout unchanged production baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 1983664d5e033dab1b131b80d9aaf2358fc6c5de
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - name: Select registered Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.18"
          architecture: x64
          check-latest: false
      - name: Install CPU development and data runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e './baseline[dev,data]' 'numpy==2.4.6' 'scipy==1.17.1' 2>&1 | tee prior48_artifacts/upload/dependency_install.log
      - name: Check manufactured orchestration gates
        shell: bash
        run: |
          set -euo pipefail
          python -B -I experiment/research/prior48/test_orchestrator_gates.py --receipt "$GITHUB_WORKSPACE/prior48_artifacts/upload/orchestrator_gate_controls.json" 2>&1 | tee prior48_artifacts/upload/orchestrator_gate_controls.log
      - name: Execute registration gate and admitted phase
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -I experiment/research/prior48/orchestrate.py --run --experiment "$GITHUB_WORKSPACE/experiment" --baseline "$GITHUB_WORKSPACE/baseline" --artifacts "$GITHUB_WORKSPACE/prior48_artifacts"
      - name: Upload retained evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prior48-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: prior48_artifacts/upload/
          retention-days: 7
          overwrite: false
          if-no-files-found: warn
          include-hidden-files: false
