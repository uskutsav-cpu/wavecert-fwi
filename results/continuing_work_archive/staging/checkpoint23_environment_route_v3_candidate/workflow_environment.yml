name: Checkpoint23 environment preparation

on:
  push:
    branches: [research-checkpoint23-environment-02]
    paths: [research/checkpoint23_environment/RUN_REGISTRATION_01.json]

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact source and preparation-only registration
        id: admission
        run: >-
          python3 -B -I research/checkpoint23_environment/prepare_environment.py
          --source-gate --github-output "$GITHUB_OUTPUT"
      - name: Stdlib process and admission controls
        run: |
          mkdir -m 700 "$RUNNER_TEMP/checkpoint23-environment-metadata"
          python3 -B -I research/checkpoint23_environment/test_environment_route.py > "$RUNNER_TEMP/checkpoint23-environment-metadata/route_controls.log" 2>&1
      - name: Separate stdlib import-probe controls
        run: >-
          python3 -B -I research/checkpoint23_environment/run_probe_controls.py
          > "$RUNNER_TEMP/checkpoint23-environment-metadata/probe_controls.log" 2>&1
      - name: Exact preparation interpreter after successful controls
        if: steps.admission.outputs.prepare == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
          architecture: x64
          check-latest: false
      - name: Environment-only preparation
        if: steps.admission.outputs.prepare == 'true'
        run: >-
          python3 -B -I research/checkpoint23_environment/prepare_environment.py
          --execute --metadata-dir "$RUNNER_TEMP/checkpoint23-environment-metadata"
      - name: Bound retained artifacts
        if: always()
        id: artifacts
        run: >-
          python3 -B -I research/checkpoint23_environment/prepare_environment.py
          --artifact-admission --metadata-dir "$RUNNER_TEMP/checkpoint23-environment-metadata"
          --github-output "$GITHUB_OUTPUT"
      - name: Small metadata only
        if: always() && steps.artifacts.outputs.metadata == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint23-environment-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint23-environment-metadata
          retention-days: 7
          compression-level: 6
          overwrite: false
          if-no-files-found: error
      - name: Separate exact wheel artifacts
        if: always() && steps.artifacts.outputs.wheels == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint23-environment-wheels-${{ github.run_id }}
          path: /opt/wavecert/checkpoint23_environment_01/wheel_artifact
          retention-days: 7
          compression-level: 0
          overwrite: false
          if-no-files-found: error
