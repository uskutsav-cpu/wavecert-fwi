name: Held cached-J native verification

on:
  push:
    branches: [research-cached-j-native-01]
    paths:
      - experiments/cached_j_native_01/**
      - .github/workflows/cached-j-native.yml
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  one-verification:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: experiment
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2918a47c68ac8bee3d33e532c21a96d335d1718a
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.18'
          architecture: x64
          check-latest: false
      - name: Ephemeral CPU verification dependencies
        run: python -m pip install --no-input -r experiment/experiments/cached_j_native_01/requirements.txt
      - name: Verify event, run58 controls, then conditionally run one native child
        run: >-
          python -B -I experiment/experiments/cached_j_native_01/run_route.py
          --baseline baseline
          --output run-artifacts/cached-j-native-01
      - name: Retain closed bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cached-j-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-artifacts/cached-j-native-01/artifact
          retention-days: 7
          if-no-files-found: warn
