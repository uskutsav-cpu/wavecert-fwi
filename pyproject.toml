[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavecert-fwi"
version = "0.3.0"
description = "A posteriori certification and selective exact-physics fallback for neural-surrogate full-waveform inversion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Utsav Research"}]
keywords = ["full-waveform inversion", "neural operator", "a posteriori error estimation", "scientific machine learning", "seismic inversion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
torch = ["torch>=2.3"]
neuralop = ["torch>=2.3", "neuraloperator>=1.0"]
devito = ["devito>=4.8"]

[project.scripts]
wavecert = "wavecert.cli:main"

[project.urls]
Homepage = "https://github.com/uskutsav-cpu/wavecert-fwi"
Issues = "https://github.com/uskutsav-cpu/wavecert-fwi/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
