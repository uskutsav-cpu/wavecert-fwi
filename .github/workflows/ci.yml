name: CI

on:
  push:
    branches-ignore: [research-checkpoint23-environment-01]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest --cov=wavecert --cov-report=term-missing

  learned-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,torch,data]'
      - run: pytest -ra
      - run: wavecert verify-physics --output /tmp/wavecert-independent
      - run: wavecert evidence-study --seeds 731 --cases-per-seed 1 --iterations 1 --calibration-cases 10 --alpha 0.2 --scenarios clean --output /tmp/wavecert-evidence
